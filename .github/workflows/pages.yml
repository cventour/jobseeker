# Publish site/ to GitHub Pages.
#
# Only site/ is published, deliberately: pointing Pages at the repo root or at docs/ would serve the
# internal Markdown (AGENT-RULES, REQUIREMENTS, the launch drafts) as a pseudo-site.
name: Pages

# MANUAL ONLY, on purpose. Deploying the site is a publishing decision, not a consequence of
# editing a file, so this never fires on push. It runs when you choose to run it, from the Actions
# tab or `gh workflow run pages.yml`.
#
# It also failed noisily on every push while Pages was disabled -- an email per commit for a job
# that could not have worked. Restore the push trigger once the site is live and you want edits to
# deploy themselves.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
