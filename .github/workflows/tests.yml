# The suites run on macOS because that is the only platform JobSeeker supports, and because the
# security suite asserts real socket binding behaviour that a Linux runner would not reproduce.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # No install step: the project declares no dependencies. If that ever stops being true,
      # this job failing is the signal.
      - run: npm run test:concurrency
      - run: npm run test:sweep
      - run: npm run test:security
      # The wizard suite builds a throwaway copy of the repo with a fake HOME and stubbed
      # launchctl/claude, because the steps it exercises write to config/ and templates/ (resolved
      # from the repo root, NOT from JOBSEEKER_DATA_DIR) and install a launch agent.
      - run: npm run test:welcome
